name: Build BatmanTunnel release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: engine/go.sum
      - name: Build amd64 and arm64
        shell: bash
        run: |
          mkdir -p bin
          cd engine
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o ../bin/batmantunnel-engine-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o ../bin/batmantunnel-engine-linux-arm64 .
          cp ../bin/batmantunnel-engine-linux-amd64 ../bin/batmantunnel-engine
      - name: Test
        run: sudo python3 -m unittest discover -s tests -v
      - name: Package
        run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: BatmanTunnel
          path: |
            dist/batmantunnel.tar.gz
            dist/SHA256SUMS
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "A release already exists; leaving its published assets unchanged."
          else
            gh release create "$GITHUB_REF_NAME" dist/batmantunnel.tar.gz dist/SHA256SUMS --title "BatmanTunnel $GITHUB_REF_NAME" --generate-notes
          fi
